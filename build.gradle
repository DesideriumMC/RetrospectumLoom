plugins {
	id "java"
	id "maven-publish"
	id "java-gradle-plugin"
	id "idea"
	id "eclipse"
}

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

// Dependencies //

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
		
		if(it.respondsTo("mavenContent")) { //doesn't exist in Gradle 4
			it.mavenContent {
				includeGroup("net.fabricmc")
				includeGroup("org.jetbrains")
				includeGroup("org.cadixdev")
			}
		}
	}
	
	mavenCentral()
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	testImplementation gradleTestKit()
	implementation gradleApi() //the currently-running version of Gradle
	
	//java staples
	compileOnly "org.jetbrains:annotations:24.0.1"
	implementation "com.google.code.gson:gson:2.8.5"
	
	//bytecode
	implementation "org.ow2.asm:asm:9.7.1"
	implementation "org.ow2.asm:asm-commons:9.7.1"
	implementation "org.ow2.asm:asm-tree:9.7.1" //same version of this stuff that tiny-remapper uses
	
	//mappings
	implementation "net.fabricmc:tiny-remapper:0.11.1"
	
	//decompilers
	implementation "org.jetbrains:intellij-fernflower:1.2.1.16"
	
	//for working with forge 1.6's binpatches.pack.lzma
	implementation "org.apache.commons:commons-compress:1.28.0" //pack200 decompression
	
	//implementation ("net.fabricmc:lorenz-tiny:1.0.0+build.1") { transitive = false } //TODO: only used by MigrateMappingsTask
	//implementation "org.cadixdev:mercury:0.1.0.fabric-SNAPSHOT" //TODO: only used by RemapSourcesJar
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Jar).configureEach { from('LICENSE', 'UPSTREAM.md') }

// Properties of the artifact //

jar {
	manifest {
		//Reading from project.version is deprecated in Gradle 7 lol
		String ver = project.respondsTo("archivesVersion") ? project.archivesVersion : project.version
		attributes "Implementation-Version": "${ver}"
	}
}

gradlePlugin {
    plugins {
        retrospectum {
            id = "dev.desiderium.retro.loom"
            implementationClass = "dev.desiderium.retro.loom.RetrospectumPlugin"
        }
    }
}

// Publishing //

task sourcesJar(type: Jar, dependsOn: classes) {
	if(it.hasProperty("archiveClassifier")) it.archiveClassifier = "sources" //Gradle 7, 8
	else it.classifier = "sources" //Gradle 4
	
	from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
	if(it.hasProperty("archiveClassifier")) it.archiveClassifier = "javadoc" //Gradle 7, 8
	else it.classifier = "javadoc" //Gradle 4
	
	from javadoc.destinationDir
}

publishing {
	publications {
        // java-gradle-plugin owns the implementation publication and marker.
        withType(MavenPublication).configureEach { publication ->
            pom {
                name = 'Retrospectum Loom'
                description = project.description
                url = 'https://github.com/DesideriumMC/RetrospectumLoom'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit/' } }
                developers { developer { id = 'DesideriumMC'; name = 'DesideriumMC contributors'; url = 'https://github.com/DesideriumMC' } }
                scm {
                    url = 'https://github.com/DesideriumMC/RetrospectumLoom'
                    connection = 'scm:git:https://github.com/DesideriumMC/RetrospectumLoom.git'
                }
            }
            if (publication.name == 'pluginMaven') {
                artifact sourcesJar
                artifact javadocJar
            }
        }
	}
	repositories {

		maven {
			name = 'localBuild'
            url = layout.buildDirectory.dir('maven')
		}
	}
}

// Javadoc settings //

javadoc {
	options {
		List<String> links = []
		links.add("https://docs.gradle.org/${gradle.gradleVersion}/javadoc/")
		links.add("https://javadoc.io/doc/com.google.code.gson/gson/2.8.5/")
		links.add("https://javadoc.io/doc/com.google.guava/guava/28.0-jre/")
		
		//yoinked off stackoverflow https://stackoverflow.com/questions/10766238/javadoc-parameter-without-package-name
		if (JavaVersion.current().isJava11Compatible()) {
			links.add("https://docs.oracle.com/en/java/javase/${JavaVersion.current().majorVersion}/docs/api/")
		} else {
			links.add("https://docs.oracle.com/javase/${JavaVersion.current().majorVersion}/docs/api/")
		}
		
		it.links(links as String[])
	}
}

// Portable plugin repository for consumers without a hosted Maven repository.
tasks.register('loomDistribution', Zip) {
    dependsOn tasks.named('publishAllPublicationsToLocalBuildRepository')
    archiveFileName = "retrospectum-loom-${project.version}-maven.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    into('loom-maven') {
        from(layout.buildDirectory.dir('maven')) {
            include "dev/desiderium/retro/retrospectum-loom/${project.version}/**"
            include "dev/desiderium/retro/loom/dev.desiderium.retro.loom.gradle.plugin/${project.version}/**"
        }
        from('LICENSE', 'UPSTREAM.md')
    }
}

tasks.withType(Javadoc).configureEach { options.addBooleanOption('notimestamp', true) }
